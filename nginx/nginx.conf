events {
    worker_connections 1024;
}

http {
    # --- Rate limiting ---
    limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    # --- Upstreams ---
    upstream promptshield {
        server promptshield-gateway:8080;
    }

    upstream dashboard {
        server dashboard:3000;
    }

    upstream web {
        server web:8000;
    }

    upstream bifrost_ui {
        server bifrost:8081;
    }

    # --- Main server (HTTP) ---
    # For HTTPS, add a second server block on :443 with ssl_certificate and
    # ssl_certificate_key, and redirect HTTP to HTTPS.
    server {
        listen 80;
        server_name _;

        # --- API (PromptShield Gateway) ---
        # NOTE: Gateway v1.0.0 only implements /v1/chat/completions and
        # /health. Other /v1/* paths will return 404 until the gateway is
        # upgraded.
        location /v1/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://promptshield;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # SSE / streaming support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 60s;
            proxy_set_header Connection "";
        }

        # Health check passthrough
        location /health {
            proxy_pass http://promptshield;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # --- Dashboard API (auth, tRPC, internal) ---
        location /api/ {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location /trpc/ {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location /internal/ {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # --- Bifrost Web UI (admin control plane) ---
        # Bifrost inference must only be reached through PromptShield at /v1/*.
        location = /bifrost/v1 {
            return 404;
        }

        location ^~ /bifrost/v1/ {
            return 404;
        }

        location /bifrost/ {
            limit_req zone=login burst=5 nodelay;
            allow 127.0.0.1;
            deny all;

            rewrite ^/bifrost/(.*) /$1 break;
            proxy_pass http://bifrost_ui;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /bifrost {
            return 301 /bifrost/;
        }

        # --- PromptShield Dashboard Web UI (catch-all) ---
        # The TanStack Start app is served by the web container at /.
        location / {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # --- Security headers ---
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
