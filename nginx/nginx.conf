events {
    worker_connections 1024;
}

http {
    # --- Rate limiting ---
    limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    # --- Upstreams ---
    upstream promptshield {
        server promptshield-gateway:8080;
    }

    upstream dashboard {
        server dashboard:3000;
    }

    upstream bifrost_ui {
        server bifrost:8081;
    }

    # --- Main server (HTTP for local, HTTPS in production) ---
    server {
        listen 80;
        server_name _;

        # --- API (PromptShield Gateway) ---
        location /v1/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://promptshield;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support (streaming)
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location /chat/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://promptshield;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # Health check passthrough
        location /health {
            proxy_pass http://promptshield;
            proxy_http_version 1.1;
        }

        # --- PromptShield Dashboard ---
        location /admin/ {
            limit_req zone=login burst=5 nodelay;
            rewrite ^/admin/(.*) /$1 break;
            proxy_pass http://dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin {
            return 301 /admin/;
        }

        # --- Bifrost Web UI (direct for local testing) ---
        location /bifrost/ {
            limit_req zone=login burst=5 nodelay;
            rewrite ^/bifrost/(.*) /$1 break;
            proxy_pass http://bifrost_ui;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /bifrost {
            return 301 /bifrost/;
        }

        # --- Security headers ---
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
