# Filter — PromptShield (PII) + Bifrost (AI Gateway)
#
# Architecture:
#   Nginx → PromptShield Gateway → Bifrost → LLM Providers
#              ↓
#         PromptShield Engine (PII Detection)
#              ↓
#         Dashboard + Postgres
#
name: filter-bifrost

services:

  # ─── Nginx (Entry Point) ──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: filter-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      promptshield-gateway:
        condition: service_healthy
      dashboard:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - filter

  # ─── PromptShield Gateway (PII Proxy) ─────────────────────
  promptshield-gateway:
    build:
      context: https://github.com/promptshieldhq/promptshield-gateway.git#v1.0.0
      dockerfile: Dockerfile
    container_name: filter-ps-gateway
    restart: unless-stopped
    environment:
      PROMPTSHIELD_PORT: "8080"
      PROMPTSHIELD_PROVIDER: ${PROMPTSHIELD_PROVIDER:-openai-compatible}
      PROMPTSHIELD_OPENAI_COMPATIBLE_UPSTREAM_URL: ${PROMPTSHIELD_OPENAI_COMPATIBLE_UPSTREAM_URL:-http://bifrost:8081/v1}
      PROMPTSHIELD_ENGINE_URL: ${PROMPTSHIELD_ENGINE_URL:-http://promptshield-engine:4321}
      PROMPTSHIELD_ENGINE_API_KEY: ${PROMPTSHIELD_ENGINE_API_KEY}
      PROMPTSHIELD_POLICY_PATH: ${PROMPTSHIELD_POLICY_PATH:-/policy/policy.yaml}
      PROMPTSHIELD_MODEL_ROUTES: ${PROMPTSHIELD_MODEL_ROUTES:-}
    volumes:
      - ./policy.yaml:/policy/policy.yaml:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      promptshield-engine:
        condition: service_healthy
      bifrost:
        condition: service_started
    networks:
      - filter

  # ─── PromptShield Engine (PII Detection) ──────────────────
  promptshield-engine:
    build:
      # NOTE: The upstream engine repository has no release tags yet. This build
      # resolves the default branch (main), which is not reproducible. Pin to a
      # commit hash (e.g. ...#<sha>) once you know a stable revision.
      context: https://github.com/promptshieldhq/promptshield-engine.git
      dockerfile: Dockerfile
      args:
        SPACY_PROFILE: ${SPACY_PROFILE:-minimal}
    container_name: filter-ps-engine
    restart: unless-stopped
    environment:
      PROMPTSHIELD_ENGINE_PORT: "4321"
      PROMPTSHIELD_ENGINE_HOST: "0.0.0.0"
      PROMPTSHIELD_API_KEY: ${PROMPTSHIELD_ENGINE_API_KEY}
      PROMPTSHIELD_ALLOW_UNAUTH: "false"
      PROMPTSHIELD_LOG_LEVEL: ${PROMPTSHIELD_LOG_LEVEL:-INFO}
    ports:
      - "4321:4321"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4321/ready')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - filter

  # ─── Database Migrations (one-shot) ───────────────────────
  db-migrate:
    build:
      context: ./promptshield-src
      dockerfile: ../Dockerfile.dashboard
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://${NGINX_HOST:-localhost}}
    container_name: filter-ps-db-migrate
    command: ["sh", "-c", "cd /app/packages/db && bunx drizzle-kit migrate"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/promptshield
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - filter
    restart: "no"

  # ─── PromptShield Dashboard API ───────────────────────────
  dashboard:
    build:
      context: ./promptshield-src
      dockerfile: ../Dockerfile.dashboard
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://${NGINX_HOST:-localhost}}
    container_name: filter-ps-dashboard
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/promptshield
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://${NGINX_HOST:-localhost}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://${NGINX_HOST:-localhost}}
      ENGINE_URL: ${ENGINE_URL:-http://promptshield-engine:4321}
      ENGINE_API_KEY: ${ENGINE_API_KEY:-${PROMPTSHIELD_ENGINE_API_KEY}}
      GATEWAY_URL: http://promptshield-gateway:8080
      POLICY_FILE_PATH: /policy/policy.yaml
      GATEWAY_ENV_PATH: /policy/gateway.env
      AUDIT_INGEST_SECRET: ${AUDIT_INGEST_SECRET}
      CONFIG_ADMIN_EMAILS: ${CONFIG_ADMIN_EMAILS:-admin@admin.com}
    volumes:
      - ./policy.yaml:/policy/policy.yaml
      - ./gateway.env:/policy/gateway.env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      promptshield-engine:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - filter

  # ─── PromptShield Dashboard Web UI ────────────────────────
  # Serves the built TanStack Start app at /. API calls are routed by nginx
  # to the dashboard server above.
  web:
    build:
      context: ./promptshield-src
      dockerfile: ../Dockerfile.dashboard
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://${NGINX_HOST:-localhost}}
    container_name: filter-ps-web
    working_dir: /app/apps/web
    command: ["bun", "run", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      VITE_SERVER_URL: ${VITE_SERVER_URL:-http://${NGINX_HOST:-localhost}}
      SSR_SERVER_URL: http://dashboard:3000
    ports:
      - "8000:8000"
    depends_on:
      dashboard:
        condition: service_healthy
    networks:
      - filter

  # ─── Audit Log Forwarder ──────────────────────────────────
  # Gateway v1.0.0 emits audit events to stdout only. This sidecar tails the
  # gateway container logs and POSTs them to the dashboard ingest endpoint.
  log-fwd:
    image: docker:27-cli
    container_name: filter-ps-log-fwd
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promptshield-src/scripts/log-fwd.sh:/log-fwd.sh:ro
    environment:
      AUDIT_INGEST_SECRET: ${AUDIT_INGEST_SECRET}
      AUDIT_SERVER_URL: http://dashboard:3000
      GATEWAY_LOG_SOURCE: ${GATEWAY_LOG_SOURCE:-docker}
      GATEWAY_CONTAINER_NAME: ${GATEWAY_CONTAINER_NAME:-filter-ps-gateway}
    command: ["sh", "/log-fwd.sh"]
    depends_on:
      dashboard:
        condition: service_healthy
    networks:
      - filter

  # ─── Postgres ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: filter-ps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: promptshield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - filter

  # ─── Bifrost (AI Gateway / Router) ────────────────────────
  bifrost:
    # Digest-pinned image; refresh intentionally after reviewing release notes.
    image: maximhq/bifrost@sha256:240634280b374bf0fae11e888f5f9238bf30a2c323a75d905059902fea2c7a5d
    container_name: filter-bifrost
    restart: unless-stopped
    # Run as root so the entrypoint can fix /app/data ownership and the app can
    # write its sqlite database inside the named volume.
    user: "0:0"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      APP_PORT: "8081"
      APP_HOST: "0.0.0.0"
      LOG_LEVEL: ${BIFROST_LOG_LEVEL:-info}
    expose:
      - "8081"
    volumes:
      # Use a named volume to avoid host UID/GID permission issues (especially
      # with rootless Docker / Lima). Pre-seed providers via the admin-only
      # /bifrost/ UI or by copying config.json into the volume after first start.
      - bifrost_data:/app/data
    networks:
      - filter

volumes:
  postgres_data:
  bifrost_data:
  certbot-www:

networks:
  filter:
    driver: bridge
